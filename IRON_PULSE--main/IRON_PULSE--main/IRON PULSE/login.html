<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Iron Pulse Gym</title>
<meta name="description" content="Log in to your Iron Pulse Gym member account.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav container">
    <a href="index.html" class="brand">IRON<span class="dot">.</span>PULSE</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="classes.html">Classes</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-cta">
      <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    </div>
  </nav>
</header>

<section class="auth-wrap">
  <div class="auth-card">
    <div class="brand">IRON<span class="dot">.</span>PULSE</div>
    <p class="auth-sub">Log in to book classes and manage your membership.</p>

    <div class="form-error" id="login-error"></div>

    <form id="login-form" novalidate>
      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required minlength="6">
      </div>
      <div class="auth-meta">
        <label class="remember">
          <input type="checkbox" name="remember" style="width:auto;">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <div class="auth-divider">or</div>

    <p class="auth-footer">Don't have an account? <a href="contact.html">Contact us to join</a></p>
  </div>
</section>

<script src="js/script.js"></script>
</body>
</html>
